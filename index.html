<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="question-container">
    <img src="teddy.png" class="local-gif" alt="Teddy Bear">
    <h1 class="question">Do you like me? ❤️</h1>

    <div class="button-container">
        <button class="btn yes-btn js-yes-btn">Yes 💖</button>
        <button class="btn no-btn js-no-btn">No 💔</button>
    </div>
</div>

<div class="result-container">
    <img src="Love.png.png" class="result-gif" alt="Love Teddy">
    <h2>I like you too! ❤️🥰</h2>
</div>
<footer class="credit">
    Jo Dimapush
</footer>

<script src="script.js"></script>
</body>
</html>
